name: Vendor audited community sources

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vendor-community.yml"
      - "ferramentas/vendor_audited_sources.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy licensed source snapshots
        run: python ferramentas/vendor_audited_sources.py
      - name: Commit imported snapshots
        run: |
          if [ -z "$(git status --porcelain -- vendor/community/)" ]; then
            echo "Nenhuma mudança."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vendor/community/
          git commit -m "vendor: adiciona fontes comunitárias licenciadas"
          git push
