name: Test original course code

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "vendor/**"
      - "site/data/projects.json"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 00-como-estudar/projetos/mini-git
          - 01-programacao/projetos/virtual-fs
          - 03-matematica-discreta/projetos/discrete-lab
          - 04-estruturas-de-dados/projetos/hashmap-python
          - 05-algoritmos/projetos/roteador-dijkstra
          - 06-arquitetura-de-computadores/projetos/alu16
          - 07-sistemas-operacionais/projetos/scheduler-simulator
          - 08-redes/projetos/http-server
          - 09-bancos-de-dados/projetos/bplus-tree
          - 10-linguagens-e-compiladores/projetos/mini-lang
          - 11-engenharia-de-software/projetos/instrumented-service
          - 12-concorrencia-e-paralelismo/projetos/thread-pool
          - 13-sistemas-distribuidos/projetos/consistent-hashing
          - 14-seguranca/projetos/password-store
          - 15-web-e-internet/projetos/mini-web
          - 16-teoria-da-computacao/projetos/automatos
          - 17-topicos-avancados/projetos/raytracer
          - 18-projetos-finais/projetos/kv-http-service
          - 18-projetos-finais/projetos/01-mini-computador
          - 18-projetos-finais/projetos/02-mini-so
          - 18-projetos-finais/projetos/03-banco-de-dados
          - 18-projetos-finais/projetos/04-redis-like
          - 18-projetos-finais/projetos/05-git-like
          - 18-projetos-finais/projetos/06-container-runtime
          - 18-projetos-finais/projetos/07-linguagem
          - 18-projetos-finais/projetos/08-distributed-kv
          - 18-projetos-finais/projetos/09-search-engine
          - 18-projetos-finais/projetos/10-stack-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest
        working-directory: ${{ matrix.project }}
        run: python -m unittest -v

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test dynamic vector
        working-directory: 02-c-e-memoria/projetos/vetor-dinamico
        run: make test

  course-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curriculum completeness
        run: python ferramentas/validate_course.py
