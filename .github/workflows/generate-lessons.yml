name: Generate complete lessons

on:
  push:
    branches: ['main']
    paths:
      - 'ferramentas/build_lessons.py'
      - '.github/workflows/generate-lessons.yml'
      - 'site/data/curriculum.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all lessons
        run: python ferramentas/build_lessons.py
      - name: Commit generated lessons
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Aulas já estão sincronizadas.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: gera as 184 aulas completas'
          git push
