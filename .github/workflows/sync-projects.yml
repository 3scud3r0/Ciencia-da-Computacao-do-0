name: Sync project catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild catalog
        run: python ferramentas/sync_projects.py

      - name: Commit only when upstream changed
        run: |
          if git diff --quiet -- site/data/projects.json; then
            echo 'Nenhuma alteração no catálogo.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/projects.json
          git commit -m 'chore: sincroniza catálogo de projetos'
          git push
