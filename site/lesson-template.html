<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} · Ciência da Computação do 0</title>
  <link rel="stylesheet" href="../../../styles.css">

<body class="lesson-page" data-lesson-path="{{PATH}}" data-has-exercise="{{HAS_EXERCISE}}">

      {{ACTIVITY}}

    <aside class="lesson-toc" aria-label="Nesta aula">
      <strong>Nesta aula</strong>

  <script src="../../../lesson.js" defer></script>
